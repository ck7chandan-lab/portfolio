# Pages CMS configuration — https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub, open this repository, and edit
# your projects and profile in a form. Every save is a commit; the host redeploys automatically.

media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [png, jpg, jpeg, webp, gif, svg, pdf, mp4]

content:
  - name: projects
    label: Projects (case studies)
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project title
        type: string
        required: true
      - name: slug
        label: URL name (lowercase-with-dashes, unique)
        type: string
        required: true
      - name: client
        label: Client / company
        type: string
      - name: category
        label: Category (used for the filter chips, e.g. Enterprise SaaS, E-commerce, Mobile app)
        type: string
      - name: domain
        label: Domain / industry
        type: string
      - name: year
        label: Year
        type: string
      - name: role
        label: Your role
        type: string
      - name: tools
        label: Tools used
        type: string
        list: true
      - name: featured
        label: Show "Featured" badge
        type: boolean
      - name: summary
        label: One-line summary (shown on hover and at the top of the case study)
        type: text
      - name: cover
        label: Cover image (4:3 works best, e.g. 1600 × 1200)
        type: image
      - name: body
        label: Case study text
        type: rich-text
      - name: gallery
        label: Images (shown full-width, one after another, like Behance)
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
          - name: caption
            label: Caption
            type: string
      - name: link
        label: Live product link (optional)
        type: string

  - name: site
    label: Profile & site settings
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Title
        type: string
      - name: headline
        label: Headline (top of the About tab)
        type: text
      - name: intro
        label: Short intro
        type: text
      - name: location
        label: Location
        type: string
      - name: availability
        label: Availability line (leave empty to hide)
        type: string
      - name: photo
        label: Profile photo (square)
        type: image
      - name: cv
        label: CV (PDF)
        type: file
      - name: email
        label: Email
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: behance
        label: Behance URL (optional)
        type: string
      - name: about
        label: About text
        type: text
      - name: skills
        label: Skills
        type: string
        list: true
      - name: tools
        label: Tools
        type: string
        list: true
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: company
            label: Company
            type: string
          - name: role
            label: Role
            type: string
          - name: period
            label: Period (e.g. 2024 – Present)
            type: string
          - name: summary
            label: What you did
            type: text
      - name: certifications
        label: Certifications
        type: object
        list: true
        fields:
          - name: name
            label: Certificate
            type: string
          - name: issuer
            label: Issued by
            type: string
          - name: note
            label: Score / year
            type: string
      - name: education
        label: Education
        type: string
